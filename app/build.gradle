plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-android-extensions'
}

android {

    compileSdkVersion COMPILE_SDK_VERSION as int

    defaultConfig {
        applicationId "com.xhuman.app"
        minSdkVersion MIN_SDK_VERSION as int
        targetSdkVersion TARGET_SDK_VERSION as int
        versionCode APP_VERSION_CODE as int
        versionName APP_VERSION_NAME
        flavorDimensions APP_VERSION_CODE
        multiDexEnabled true

        packagingOptions {
            exclude 'META-INF/library_release.kotlin_module'
            exclude 'META-INF/rxjava.properties'
        }
        ndk {
            abiFilters 'armeabi', 'armeabi-v7a', 'x86', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            keyAlias 'xhuman'
            keyPassword 'xh123456'
            storeFile file('../keystore/xhuman_android_key.jks')
            storePassword 'xh123456'
        }
    }

    // 自定义输出配置
    // AS3.0版本 设置apk名称
    applicationVariants.all {
        //判断是release还是debug版本
        def buildType = it.buildType.name
        def fileName
        // 获取当前时间的"YYYY-MM-dd"格式。
        def createTime = new Date().format("YYYY-MM-dd-HHmm", TimeZone.getTimeZone("GMT+08:00"))
        //只对Release包起作用，如果不是Release包则不变更输出路径，否则可能导致AS无法自动安装debug包。
//		if (buildType == "release") {
//			getPackageApplication().outputDirectory = new File(project.rootDir.absolutePath + "/apks/${createTime}")
//		}
        it.outputs.each {
            //只对Release包起作用，如果不是Release包则不变更名称。
            if (buildType == 'debug') {//如果是debug包
                fileName = "xhuman_owner_beta_${defaultConfig.versionName}.apk"
                println "OUT FILE NAME ----------------- ${fileName}"
                it.outputFileName = fileName
            } else if (buildType == "release") {
                //此处的命名规则是：项目名_渠道名_版本名_创建时间.apk
                fileName = "xhuman_owner_release_${defaultConfig.versionName}.apk"
                //将名字打印出来，以便及时查看是否满意。
                println "OUT FILE NAME ----------------- ${fileName}"
                // 重新对apk命名。(适用于Gradle3.0以下版本)
                // outputFile = new File(outputFile.parent, fileName)
                // 重新对apk命名。(适用于Gradle3.0（含）以上版本)如果你Gradle版本是4.0以下版本则将上面的一行代码放开并注释下面的这一行。
                it.outputFileName = fileName
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "SEVER_API", DEBUG_SERVER_API
            buildConfigField "String", "SEVER_URL", DEBUG_SERVER_URL
            //显示log
            buildConfigField "boolean", "LOG_DEBUG", "true"
            signingConfig signingConfigs.release
        }
        release {
            buildConfigField "String", "SEVER_API", RELEASE_SERVER_API
            buildConfigField "String", "SEVER_URL", RELEASE_SERVER_URL
            // 不显示Log
            buildConfigField "boolean", "LOG_DEBUG", "false"
            //混淆
            minifyEnabled false
            // Zipalign压缩优化
            zipAlignEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.2.0'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.annotation:annotation:1.3.0'
    implementation 'com.google.android.material:material:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    //权限
    implementation "com.github.getActivity:XXPermissions:18.63"

}